<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One - Super Cute Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1e1e2f;
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            padding: 12px;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 22px;
            border-radius: 18px;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #score-board {
            color: #4cd137;
            border-bottom: 4px solid #44bd32;
        }
        #shots-board {
            color: #ff9f43;
            border-bottom: 4px solid #ee5253;
        }
        #msg-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            font-family: 'Fredoka One', cursive;
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 0 6px 0 #d35400, 0 12px 25px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        #msg-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            background: rgba(44, 62, 80, 0.75);
            padding: 10px 24px;
            border-radius: 30px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            
            <div id="ui-layer">
                <div class="hud-card" id="score-board">✨ Score: 0</div>
                <div class="hud-card" id="shots-board">🎯 Shots: 0</div>
            </div>

            <div id="msg-overlay">MOLE IN ONE! 🐾</div>
            <div id="instructions">Pull back your cute mole and let go to launch! ✨</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
