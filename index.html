<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            margin-bottom: 10px;
            font-size: 40px;
        }
        canvas {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: grab;
            background-color: white;
        }
        canvas:active {
            cursor: grabbing;
        }
        #instructions {
            margin-top: 15px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Mole in One!</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="instructions">Drag the mole backwards into the slingshot, then let go!</div>

    <script src="script.js"></script>
</body>
</html>
