<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mole in One - Mole Day Slingshot</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #24293e, #0f1016);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f1f5f9;
    }
    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      align-items: center;
    }
    .badge {
      background: #334155;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid #475569;
    }
    canvas {
      background: linear-gradient(to bottom, #7dd3fc 0%, #bae6fd 60%, #cbd5e1 60%);
      border: 4px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .controls {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge">Happy Mole Day (10/23 • 6:02)</div>
    <div class="badge">Avogadro: 6.022 × 10²³</div>
    <div class="badge" id="attemptsDisplay">Tries: 1</div>
  </div>

  <canvas id="gameCanvas" width="860" height="480"></canvas>

  <div class="controls">Pull back the mole from the slingshot and let fly! Press <strong>R</strong> to restart shot.</div>

  <!-- Connect your JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
