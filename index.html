<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #87CEEB; /* Sky blue background */
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #a0d8ef;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        #instructions {
            margin-top: 15px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Mole in One!</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="instructions">Click and drag the mole backwards, then release to shoot into the hole!</div>

    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
