<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #87CEEB; /* Sky blue background */
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none; /* Let mouse clicks pass through to the game */
        }
    </style>
    <!-- Import Matter.js for Angry Birds style physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="instructions">
        <h2>Mole in One</h2>
        <p>Drag the cute mole back, aim, and release to shoot it into the hole!</p>
    </div>
    
    <!-- Link to your game logic -->
    <script src="script.js"></script>
</body>
</html>
