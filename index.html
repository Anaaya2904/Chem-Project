<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #7ec0ee 0%, #7ec0ee 70%, #5c9e31 70%, #4d8727 100%);
            border: 6px solid #3e6b1e;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            color: #2e4d16;
            border: 2px solid #4d8727;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #msg-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            text-align: center;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="ui-layer">
            <div class="hud-card" id="score-board">Score: 0</div>
            <div class="hud-card" id="shots-board">Shots: 0</div>
        </div>

        <div id="msg-overlay">MOLE IN ONE!</div>
        <div id="instructions">Click and pull back on the mole to launch it into the hole!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
