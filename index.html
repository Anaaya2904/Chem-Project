<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole in One - Premium Edition</title>
    <!-- Playful game font integration -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #111625;
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            padding: 15px;
            background: linear-gradient(135deg, #2c3e50, #0f171e);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }
        canvas {
            display: block;
            background: #87CEEB;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 16px;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #2c3e50;
            border-bottom: 4px solid #bdc3c7;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #score-board {
            color: #27ae60;
            border-bottom-color: #219653;
        }
        #shots-board {
            color: #e67e22;
            border-bottom-color: #d35400;
        }
        #msg-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-family: 'Fredoka One', cursive;
            font-size: 55px;
            color: #f1c40f;
            text-shadow: 0 6px 0 #d35400, 0 12px 20px rgba(0,0,0,0.4);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        #msg-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 30px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            
            <div id="ui-layer">
                <div class="hud-card" id="score-board">⛳ Score: 0</div>
                <div class="hud-card" id="shots-board">🚀 Shots: 0</div>
            </div>

            <div id="msg-overlay">MOLE IN ONE!</div>
            <div id="instructions">Pull back the mole like a slingshot to launch it!</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
